<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Palette Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #222;
      letter-spacing: -0.02em;
    }

    .palette {
      display: flex;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 600px;
      max-width: 95vw;
      height: 320px;
    }

    .swatch {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 16px;
      cursor: pointer;
      position: relative;
      transition: flex 0.2s ease;
    }

    .swatch:hover {
      flex: 1.4;
    }

    .swatch-label {
      background: rgba(0,0,0,0.25);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }

    .swatch:hover .swatch-label {
      opacity: 1;
    }

    .copied-toast {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    .swatch.just-copied .copied-toast {
      opacity: 1;
    }

    button {
      background: #222;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:hover {
      background: #444;
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>Color Palette Generator</h1>

  <div class="palette" id="palette"></div>

  <button onclick="generate()">Generate Palette</button>
  <p class="hint">Hover a color to see its hex code — click to copy</p>

  <script>
    function randomHex() {
      return '#' + Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0');
    }

    function generate() {
      const palette = document.getElementById('palette');
      palette.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const hex = randomHex();
        const swatch = document.createElement('div');
        swatch.className = 'swatch';
        swatch.style.background = hex;
        swatch.innerHTML = `
          <div class="copied-toast">Copied!</div>
          <div class="swatch-label">${hex}</div>
        `;
        swatch.addEventListener('click', () => {
          navigator.clipboard.writeText(hex);
          swatch.classList.add('just-copied');
          setTimeout(() => swatch.classList.remove('just-copied'), 1000);
        });
        palette.appendChild(swatch);
      }
    }

    generate();
  </script>
</body>
</html>
